<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrite rules, so any deep link (or a refresh
      // on a non-root path) hits this 404 page instead of index.html. This script
      // re-encodes the path into a query string and redirects to the real app, which
      // decodes it back via the matching script in index.html before React Router reads
      // the URL. pathSegmentsToKeep = 1 because the app lives one segment deep, at
      // https://Zwe4968.github.io/zwe_pyae_aung_portfolio/.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
