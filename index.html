  <body>

    <script>
      // Decodes the path the public/404.html redirect re-encoded into the
      // query string, restoring the real URL before React Router reads
      // window.location. Must run before main.tsx (it does — this is a
      // plain script, which executes before the deferred module script below).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
